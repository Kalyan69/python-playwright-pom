name: QAFox Playwright tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Run UI tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Install Chromium and system dependencies
        run: python -m playwright install --with-deps chromium

      - name: Run tests and generate HTML report
        env:
          QAFOX_TIMEOUT_MS: "10000"
        run: python -m pytest --html=reports/report.html --self-contained-html

      - name: Upload HTML report and failure screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qafox-playwright-results
          path: |
            reports/report.html
            screenshots/
          if-no-files-found: warn
          retention-days: 14
